# Setup of Albrecht and Tombe (2016, Canadian Journal of Economics 49(1);
# working paper version May 2015): 10 provinces and the rest of the world (US
# included), 22 sectors, Canada-wide input-output coefficients, Caliendo-Parro
# trade elasticities (their Table 9), balanced trade, gravity on log normalized
# distance with exporter and importer fixed effects, exporter-specific
# (asymmetric) trade costs and the augmented Head-Ries index for the
# measured-cost experiments of their Table 6.
#
# Calibration year. The paper uses 2010. The repository holds the ICIO tables
# for 2016-2022, so this configuration uses 2016; with
# data/raw/icio/ICIO2025_2010.csv (https://oe.cd/icio) set years to 2010.
# docs/replication.md compares the results with the paper.
extends: default.yml
name: albrecht_tombe_2016
description: >
  Albrecht and Tombe (2016) setup: 10 provinces + rest of the world, 22 sectors,
  national input-output structure, balanced trade.

years:
  target: 2016
  panel: [2016, 2016]     # one cross-section, as in the paper

regions:
  domestic: ["NL", "PE", "NS", "NB", "QC", "ON", "MB", "SK", "AB", "BC"]
  foreign: ["ROW"]

sectors:
  scheme: config/concordances/sector_scheme_albrecht_tombe_2016.csv

io_parameters:
  source: national

trade_elasticities:
  method: fixed
  file: config/parameters/theta_albrecht_tombe_2016.csv

trade_costs:
  sample: interprovincial
  regressors: [log_dist]
  exclude_sectors: [UTL, CON, PAD]
  measured_index: augmented   # tau_tilde = tau_bar (t_i / t_n)^(1/2), paper section 4.3.1

calibration:
  deficits: purge         # the paper's model has balanced trade (proposition 1)

aggregation:
  canada_weights: real_income   # initial shares of real GDP (proposition 3, Table 8)

scenarios:
  - config/scenarios/albrecht_tombe_2016.yml
